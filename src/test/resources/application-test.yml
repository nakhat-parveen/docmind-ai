spring:
  ai:
    vectorstore:
      pgvector:
        dimensions: 384

docmind:
  ingestion:
    chunk-size: 60
    min-chunk-size-chars: 50
  processing:
    retry-interval: 100ms
  retrieval:
    similarity-threshold: 0.05
  security:
    api-keys: test-key

logging:
  level:
    org.testcontainers: WARN
