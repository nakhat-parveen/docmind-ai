spring:
  ai:
    vectorstore:
      pgvector:
        dimensions: 384

docmind:
  ingestion:
    chunk-size: 60
    min-chunk-size-chars: 50
  processing:
    retry-interval: 100ms
  outbox:
    poll-interval: 100ms
  retrieval:
    similarity-threshold: 0.05
  security:
    api-keys: test-key
  rate-limit:
    # other tests share a context and would trip a tight limit
    enabled: false

logging:
  level:
    org.testcontainers: WARN

# Spring Boot switches metric exporters off in tests; the Prometheus endpoint is tested on purpose
management:
  prometheus:
    metrics:
      export:
        enabled: true
