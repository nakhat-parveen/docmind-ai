spring:
  application:
    name: docmind-ai
  profiles:
    default: ollama

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/docmind}
    username: ${DB_USERNAME:docmind}
    password: ${DB_PASSWORD:docmind}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    placeholders:
      embedding_dimensions: ${spring.ai.vectorstore.pgvector.dimensions}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  data:
    web:
      pageable:
        max-page-size: 100

  ai:
    # Only chat and embedding models are used. The provider profiles switch these on.
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    vectorstore:
      pgvector:
        initialize-schema: false
        index-type: hnsw
        distance-type: cosine_distance
        dimensions: 768

docmind:
  ingestion:
    chunk-size: 400
    min-chunk-size-chars: 200
  retrieval:
    default-top-k: 5
    similarity-threshold: 0.3
  security:
    header-name: X-API-Key
    api-keys: ${DOCMIND_API_KEYS:local-dev-key}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
