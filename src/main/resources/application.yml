spring:
  application:
    name: docmind-ai
  profiles:
    default: ollama

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/docmind}
    username: ${DB_USERNAME:docmind}
    password: ${DB_PASSWORD:docmind}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    placeholders:
      embedding_dimensions: ${spring.ai.vectorstore.pgvector.dimensions}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  data:
    web:
      pageable:
        max-page-size: 100

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        # fail fast when Kafka is down; the outbox relay retries on its next run
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: docmind
      auto-offset-reset: earliest
      # a message that cannot be read is handed to the error handler instead of blocking the partition
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.docmind.processing.DocumentUploadedEvent
        spring.json.use.type.headers: false

  ai:
    # Only chat and embedding models are used. The provider profiles switch these on.
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    vectorstore:
      pgvector:
        initialize-schema: false
        index-type: hnsw
        distance-type: cosine_distance
        dimensions: 768
    mcp:
      server:
        name: docmind
        version: 0.1.0
        type: sync
        protocol: streamable
        instructions: Search and ask questions about documents stored in DocMind.
        annotation-scanner:
          enabled: false

docmind:
  ingestion:
    chunk-size: 400
    min-chunk-size-chars: 200
  processing:
    max-attempts: 3
    retry-interval: 2s
  outbox:
    poll-interval: 1s
    batch-size: 50
    # a bit longer than delivery.timeout.ms, so the producer gives up first
    send-timeout: 15s
    retention: 7d
    cleanup-cron: "0 0 3 * * *"
  retrieval:
    default-top-k: 5
    similarity-threshold: 0.3
  security:
    header-name: X-API-Key
    api-keys: ${DOCMIND_API_KEYS:local-dev-key}
  rate-limit:
    # 30 questions per minute per API key, with a burst of 30
    enabled: true
    capacity: 30
    refill-tokens: 30
    refill-period: 1m

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # histogram buckets let Prometheus calculate percentiles such as p95
      percentiles-histogram:
        http.server.requests: true
        docmind.documents.processing.duration: true
        docmind.answer.duration: true

springdoc:
  # the API answers with JSON; without this the docs show */* for every response
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    # added to every log line, filled by CorrelationIdFilter and the Kafka record interceptor
    correlation: "[%X{correlationId:-}] "
