spring:
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.1
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        # text-embedding-3-small produces 1536-dimensional vectors
        dimensions: 1536
